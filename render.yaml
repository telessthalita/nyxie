services:
  - type: web
    name: nyxie
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        # Uma semana: as imagens em public/assets não têm hash no nome.
        value: public, max-age=604800
    routes:
      # Página de bastidores: o mesmo index.html decide o que mostrar.
      - type: rewrite
        source: /bastidores
        destination: /index.html
