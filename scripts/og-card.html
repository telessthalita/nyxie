<!doctype html>
<!--
  Arte da prévia de compartilhamento (LinkedIn, WhatsApp, X...).
  Gerada com: npm run og  (abre este arquivo no Chrome sem janela e salva public/og-image.jpg em 1200x630)
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;800&family=Pixelify+Sans:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: radial-gradient(circle at 78% 30%, rgb(240 107 168 / 0.45), transparent 45%),
          radial-gradient(circle at 5% 100%, rgb(153 92 224 / 0.45), transparent 45%), #14091a;
        color: #ffeaf4;
        font-family: 'Nunito', sans-serif;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 70px;
        width: 620px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        border: 2px solid #9b5de0;
        border-radius: 999px;
        background: #5b2e91;
        font: 700 17px 'Pixelify Sans';
        letter-spacing: 0.06em;
      }
      h1 {
        margin-top: 26px;
        font: 400 168px/0.9 'Bagel Fat One';
      }
      h1 span {
        display: block;
        font-size: 92px;
        line-height: 1;
        color: #f06ba8;
      }
      p {
        margin-top: 26px;
        max-width: 540px;
        font-size: 26px;
        line-height: 1.4;
        color: #c9a9c0;
      }
      .arch {
        position: absolute;
        right: 80px;
        top: 60px;
        width: 360px;
        height: 620px;
        border: 4px solid #f06ba8;
        border-radius: 180px 180px 0 0;
        border-bottom: 0;
        background: #ffd9eb;
        overflow: hidden;
      }
      .arch img {
        position: absolute;
        /* pose "Hora do show!" da folha de poses */
        width: 2356px;
        left: -1876px;
        top: -700px;
        mix-blend-mode: multiply;
      }
      .ring {
        position: absolute;
        right: 40px;
        top: 230px;
        width: 440px;
        height: 440px;
        border: 3px dashed #9b5de0;
        border-radius: 50%;
      }
      .heart {
        position: absolute;
        width: 46px;
      }
      .tag {
        position: absolute;
        left: 72px;
        bottom: 46px;
        font: 700 17px 'Pixelify Sans';
        letter-spacing: 0.12em;
        color: #ffa8cf;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <div class="arch"><img src="../public/assets/poses.webp" alt="" /></div>
    <svg class="heart" style="right: 455px; top: 120px; rotate: -14deg" viewBox="0 0 24 24"><path fill="#ffeaf4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
    <svg class="heart" style="right: 30px; top: 70px; width: 60px; rotate: 12deg" viewBox="0 0 24 24"><path fill="#f06ba8" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
    <svg class="heart" style="right: 440px; top: 470px; width: 38px; rotate: 10deg" viewBox="0 0 24 24"><path fill="#b83c7e" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
    <div class="text">
      <span class="chip">✦ LISTA DE DESEJOS ABERTA · 2027</span>
      <h1>NYXIE<span>DEAD AIR</span></h1>
      <p>Um RPG de ritmo e ação onde cada batida é um golpe.</p>
    </div>
    <span class="tag">♪ COM TRILHA SONORA E MINI-JOGO DE RITMO</span>
  </body>
</html>
